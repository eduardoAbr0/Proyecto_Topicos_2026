services:
  app:
    build:
      context: .
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_CLOUDFLARE_SITEKEY: ${NEXT_PUBLIC_CLOUDFLARE_SITEKEY}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./db
      args:
        DB_NAME: ${DB_NAME}
        DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data: